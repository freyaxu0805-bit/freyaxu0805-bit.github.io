<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .bg { fill: #f0f4ff; }
      .desk { fill: #d4a574; stroke: #b8845a; stroke-width: 2; }
      .screen { fill: #e8f4f8; stroke: #888; stroke-width: 2; }
      .screen-inner { fill: #c7e9f0; }
      .cat-body { fill: #f5c842; }
      .cat-stripe { fill: #e0a832; }
      .cat-face { fill: #f5c842; }
      .eye { fill: #333; }
      .eye-white { fill: #fff; }
      .nose { fill: #ff8a8a; }
      .mouth { fill: none; stroke: #333; stroke-width: 1.5; stroke-linecap: round; }
      .ear { fill: #f5c842; }
      .ear-inner { fill: #ffb5b5; }
      .whisker { fill: none; stroke: #555; stroke-width: 1.2; stroke-linecap: round; }
      .paw { fill: #f5c842; stroke: #e0a832; stroke-width: 1.5; }
      .tail { fill: #f5c842; stroke: #e0a832; stroke-width: 2; }
      .monitor-stand { fill: #999; stroke: #777; stroke-width: 1.5; }
      .keyboard { fill: #ddd; stroke: #bbb; stroke-width: 1.5; }
      .coffee { fill: #8B4513; stroke: #6B3410; stroke-width: 1.5; }
      .coffee-steam { fill: none; stroke: #ccc; stroke-width: 1; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" class="bg"/>

  <!-- Desk surface -->
  <rect x="60" y="260" width="280" height="18" rx="4" class="desk"/>
  <rect x="80" y="278" width="8" height="70" class="desk"/>
  <rect x="312" y="278" width="8" height="70" class="desk"/>

  <!-- Monitor -->
  <rect x="130" y="110" width="140" height="100" rx="8" class="screen"/>
  <rect x="136" y="116" width="128" height="88" rx="4" class="screen-inner"/>
  <!-- Code lines on screen -->
  <line x1="146" y1="130" x2="210" y2="130" stroke="#5a9" stroke-width="3" stroke-linecap="round"/>
  <line x1="146" y1="145" x2="240" y2="145" stroke="#5a9" stroke-width="3" stroke-linecap="round"/>
  <line x1="156" y1="160" x2="230" y2="160" stroke="#5a9" stroke-width="3" stroke-linecap="round"/>
  <line x1="156" y1="175" x2="200" y2="175" stroke="#5a9" stroke-width="3" stroke-linecap="round"/>
  <line x1="146" y1="190" x2="220" y2="190" stroke="#f8a" stroke-width="3" stroke-linecap="round"/>
  <!-- Monitor stand -->
  <rect x="190" y="210" width="20" height="12" class="monitor-stand"/>
  <rect x="182" y="222" width="36" height="8" rx="2" class="monitor-stand"/>

  <!-- Keyboard -->
  <rect x="140" y="238" width="80" height="14" rx="3" class="keyboard"/>
  <line x1="160" y1="241" x2="160" y2="249" stroke="#bbb" stroke-width="1"/>
  <line x1="175" y1="241" x2="175" y2="249" stroke="#bbb" stroke-width="1"/>
  <line x1="190" y1="241" x2="190" y2="249" stroke="#bbb" stroke-width="1"/>
  <line x1="160" y1="241" x2="160" y2="249" stroke="#bbb" stroke-width="1"/>

  <!-- Coffee mug -->
  <rect x="288" y="218" width="18" height="20" rx="3" class="coffee"/>
  <path d="M306 223 Q312 223 312 228 Q312 233 306 233" fill="none" stroke="#6B3410" stroke-width="2"/>
  <ellipse cx="297" cy="218" rx="9" ry="3" fill="#a05a2c" stroke="#6B3410" stroke-width="1"/>
  <path d="M293 214 Q297 208 301 214" class="coffee-steam"/>
  <path d="M295 210 Q297 205 299 210" class="coffee-steam"/>

  <!-- Cat body behind desk (shown from chest up) -->
  <!-- Tail curling behind -->
  <path d="M60 240 Q30 210 40 180 Q50 150 70 170" class="tail" fill="none"/>

  <!-- Cat chest/shoulders visible above desk -->
  <ellipse cx="200" cy="290" rx="50" ry="20" class="cat-body"/>

  <!-- Left arm/paw on keyboard -->
  <path d="M155 255 Q145 248 140 244" stroke="#e0a832" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="138" cy="243" rx="6" ry="5" class="paw"/>

  <!-- Right arm/paw on mouse area -->
  <path d="M230 255 Q240 250 245 244" stroke="#e0a832" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="247" cy="243" rx="6" ry="5" class="paw"/>

  <!-- Cat head -->
  <circle cx="200" cy="195" r="38" class="cat-face"/>

  <!-- Ears -->
  <polygon points="168,165 158,128 182,158" class="ear"/>
  <polygon points="163,163 158,138 177,158" class="ear-inner"/>
  <polygon points="232,165 242,128 218,158" class="ear"/>
  <polygon points="237,163 242,138 223,158" class="ear-inner"/>

  <!-- Forehead stripes -->
  <path d="M192 170 L200 162 L208 170" class="cat-stripe" stroke="#e0a832" stroke-width="2.5" fill="none"/>
  <path d="M188 176 L200 166 L212 176" class="cat-stripe" stroke="#e0a832" stroke-width="2" fill="none"/>

  <!-- Eyes -->
  <circle cx="184" cy="192" r="7" class="eye-white"/>
  <circle cx="216" cy="192" r="7" class="eye-white"/>
  <circle cx="184" cy="192" r="4.5" class="eye"/>
  <circle cx="216" cy="192" r="4.5" class="eye"/>
  <circle cx="182" cy="190" r="1.5" fill="#fff"/>
  <circle cx="214" cy="190" r="1.5" fill="#fff"/>

  <!-- Nose -->
  <polygon points="197,200 203,200 200,204" class="nose"/>

  <!-- Mouth -->
  <path d="M200 204 Q194 210 188 206" class="mouth"/>
  <path d="M200 204 Q206 210 212 206" class="mouth"/>

  <!-- Whiskers left -->
  <line x1="160" y1="195" x2="140" y2="190" class="whisker"/>
  <line x1="160" y1="200" x2="138" y2="200" class="whisker"/>
  <line x1="160" y1="205" x2="140" y2="210" class="whisker"/>

  <!-- Whiskers right -->
  <line x1="240" y1="195" x2="260" y2="190" class="whisker"/>
  <line x1="240" y1="200" x2="262" y2="200" class="whisker"/>
  <line x1="240" y1="205" x2="260" y2="210" class="whisker"/>

  <!-- Cheek blush -->
  <ellipse cx="172" cy="202" rx="7" ry="4" fill="#ffb5b5" opacity="0.4"/>
  <ellipse cx="228" cy="202" rx="7" ry="4" fill="#ffb5b5" opacity="0.4"/>
</svg>
