        caption: 2025.09 - 至今
        description: |
          荣誉：校三好学生、特等学业奖学金、文体竞赛奖学金、第九届东方财富杯北京市三等奖

          核心课程：数据挖掘与量化投资、高阶运筹学、统计学、金融计量、公司金融、投资学、经济学、Python
  - title: Projects
    layout: list
    content:
      - layout: left
        title: 证券量化分析与大模型文本挖掘
        sub_title: 课程项目
        caption: 2025.10 - 2025.11
        description: |
          运用 Python 清洗特定股票历史交易数据并实现 K 线图等指标可视化。利用 AI 工具协同搭建简易 CNN 模型进行短期涨跌趋势预测。调用大模型 API 对金融新闻文本进行批量情感判别，探索外部舆情对股价波动的影响。
      - layout: left
        title: 红色剧本杀市场调研
        sub_title: 社会实践项目
        caption: 2023.07 - 2023.08
        description: |
          针对北京市沉浸式娱乐细分市场开展专项调研。设计结构化电话访谈，收集主流消费平台公开数据，全方位剖析商家运营模式与核心用户画像。成功谈判对接 2 家核心合作店铺，削减约 30% 线下调研成本。
      - layout: left
        title: 领航创新创业协会
        sub_title: 团队负责人
        caption: 2021.09 - 2022.06
        description: |
          协助统筹组织学校大型赛事及活动，负责赛程各节点推进与跨部门资源协同调度。统筹完成 4 万余字商业计划书框架搭建与撰写，主导商业模式画布分析及模拟比赛路演。
  - title: 技能与能力
    layout: text
    content: |
      **软件工具**：熟练使用 PowerPoint、Word、飞书进行办公协作，运用 Excel、Stata、Python 进行数据分析与建模。

      **语言能力**：英语 CET-6（500）

