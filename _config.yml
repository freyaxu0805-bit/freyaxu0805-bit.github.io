about_content: |
  # About Me

  互联网商业化与金融背景的复合型硕士生，具备行业研究、数据分析、商业运营及项目执行能力，能通过数据洞察与市场研究驱动业务决策。

  **新浪微博 . 效果广告部实习生** — 搭建游戏行业市场动态监测机制，独立输出行业季度报告，辅助销售团队识别商业合作机会。

  **浦发银行 . 公司金融部实习生** — 参与对公风控与客户数据治理，完成 1000+ 份核心客户资产信息维护。

  **关注方向**：持续探索 AI 工具在数据分析与商业场景中的落地应用，在量化项目中使用大模型 API 进行金融文本挖掘。

content:
  - title: Experience
    layout: list
    content:
      - layout: right
        title: 新浪微博
        sub_title: 效果广告部实习生（游戏行业销管）
        caption: 2024.12 - 2025.05
        description: |
          搭建游戏行业市场动态长效监测机制，全面追踪机构研报与行业媒体资讯；精准锁定新游预约、公测、上线及版本更新等关键营销生命周期节点，独立输出 2 份行业季度报告及配套结构化数据汇总表。

          整合分析游戏榜单多源市场数据，全量统计并量化微博平台新游渗透率，输出核心潜客线索画像，辅助销售团队精准识别商业合作机会。

          深度对接 9 位核心销售人员，全周期跟进客户合同审批、归档及内部合规流转，有效提升跨部门沟通效率。
      - layout: right
        title: 上海浦东发展银行北京分行
        sub_title: 公司金融部实习生
        caption: 2023.07 - 2023.09
        description: |
          深度参与对公业务风险控制流程，严格审核中小企业授信申请资料，核验企业股权结构、工商证照及财务底层流水。

          运用 Excel 对部门对公客户数据进行全量清洗与结构化处理，完成 1000+ 份核心客户基础资产信息维护与资产标签优化。

          基于目标客群画像与商家资源深度匹配，输出整合宣传方案并全盘获批落地执行，促成活动名额在短时间内迅速报满。
